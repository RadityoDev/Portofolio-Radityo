<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Hopper</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111827;
        font-family: Arial, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    #game {
        position: relative;
        width: 400px;
        height: 600px;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        border-radius: 18px;
        background: linear-gradient(#61c8ff, #d9f5ff);
        box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        text-align: center;
    }

    #score {
        margin-top: 25px;
        color: white;
        font-size: 52px;
        font-weight: 900;
        text-shadow:
            3px 3px 0 rgba(0,0,0,.25),
            0 4px 10px rgba(0,0,0,.2);
    }

    #message {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        pointer-events: auto;
    }

    #message h1 {
        color: white;
        font-size: 42px;
        text-shadow: 3px 4px 0 rgba(0,0,0,.25);
        margin-bottom: 12px;
    }

    #message p {
        color: white;
        font-size: 18px;
        margin-bottom: 20px;
        text-shadow: 1px 2px 3px rgba(0,0,0,.3);
    }

    button {
        border: none;
        padding: 13px 28px;
        border-radius: 999px;
        background: #ffca28;
        color: #513600;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 0 #d99f00;
    }

    button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #d99f00;
    }

    #hint {
        position: absolute;
        bottom: 18px;
        width: 100%;
        color: rgba(255,255,255,.9);
        font-size: 14px;
        text-shadow: 1px 2px 3px rgba(0,0,0,.3);
    }

    @media (max-width: 430px) {
        #game {
            border-radius: 0;
            width: 100vw;
            height: 100vh;
        }
    }
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="ui">
        <div id="score">0</div>

        <div id="message">
            <h1>SKY HOPPER</h1>
            <p>Tekan SPACE atau tap layar</p>
            <button id="startBtn">MULAI</button>
        </div>

        <div id="hint">
            Hindari pilar • Semakin jauh semakin cepat
        </div>
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

const W = 400;
const H = 600;

canvas.width = W;
canvas.height = H;

let bird;
let pipes;
let score;
let highScore = Number(localStorage.getItem("skyHopperHigh") || 0);

let gameRunning = false;
let gameStarted = false;
let frame = 0;

const gravity = 0.42;
const jumpPower = -7.2;

function resetGame() {
    bird = {
        x: 90,
        y: 280,
        radius: 15,
        velocity: 0,
        rotation: 0
    };

    pipes = [];
    score = 0;
    frame = 0;

    scoreText.textContent = "0";
}

function startGame() {
    resetGame();

    gameRunning = true;
    gameStarted = true;

    message.style.display = "none";

    requestAnimationFrame(loop);
}

function flap() {
    if (!gameStarted) {
        startGame();
        return;
    }

    if (!gameRunning) {
        startGame();
        return;
    }

    bird.velocity = jumpPower;
}

function createPipe() {
    const gap = Math.max(130, 175 - score * 2);

    const minTop = 70;
    const maxTop = H - 100 - gap;

    const top = Math.random() * (maxTop - minTop) + minTop;

    pipes.push({
        x: W + 20,
        width: 65,
        top: top,
        gap: gap,
        passed: false
    });
}

function update() {

    frame++;

    // Bird physics
    bird.velocity += gravity;
    bird.y += bird.velocity;

    bird.rotation = Math.min(
        Math.max(bird.velocity * 0.08, -0.5),
        1.2
    );

    // Pipe spawning
    const spawnRate = Math.max(85, 125 - score * 2);

    if (frame % spawnRate === 0) {
        createPipe();
    }

    // Pipe movement
    const speed = Math.min(4.8, 2.8 + score * 0.08);

    for (let pipe of pipes) {
        pipe.x -= speed;

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
            pipe.passed = true;
            score++;

            scoreText.textContent = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem(
                    "skyHopperHigh",
                    highScore
                );
            }
        }
    }

    pipes = pipes.filter(pipe => pipe.x + pipe.width > -20);

    // Collision with ground / ceiling
    if (
        bird.y - bird.radius < 0 ||
        bird.y + bird.radius > H - 55
    ) {
        gameOver();
    }

    // Pipe collision
    for (let pipe of pipes) {

        const insideX =
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + pipe.width;

        const hitTop =
            bird.y - bird.radius < pipe.top;

        const hitBottom =
            bird.y + bird.radius > pipe.top + pipe.gap;

        if (insideX && (hitTop || hitBottom)) {
            gameOver();
        }
    }
}

function gameOver() {

    if (!gameRunning) return;

    gameRunning = false;

    message.innerHTML = `
        <h1>GAME OVER</h1>
        <p>Score: <b>${score}</b></p>
        <p>Best: <b>${highScore}</b></p>
        <button id="restartBtn">MAIN LAGI</button>
    `;

    message.style.display = "flex";

    document
        .getElementById("restartBtn")
        .addEventListener("click", startGame);
}

function drawBackground() {

    // Sky
    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#55c7ff");
    gradient.addColorStop(1, "#d9f6ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    drawCloud(60, 100, 0.8);
    drawCloud(300, 160, 0.65);
    drawCloud(190, 65, 0.45);

    // Mountains
    ctx.fillStyle = "#8bd5a7";

    ctx.beginPath();
    ctx.moveTo(0, 470);
    ctx.lineTo(80, 360);
    ctx.lineTo(160, 470);
    ctx.lineTo(250, 340);
    ctx.lineTo(400, 470);
    ctx.lineTo(400, 600);
    ctx.lineTo(0, 600);
    ctx.fill();

    // Ground
    ctx.fillStyle = "#75c85a";
    ctx.fillRect(0, H - 55, W, 55);

    ctx.fillStyle = "#4c9d3e";
    ctx.fillRect(0, H - 55, W, 8);

    // Ground details
    ctx.fillStyle = "#5aaa46";

    for (let x = 0; x < W; x += 25) {
        ctx.fillRect(
            x,
            H - 40,
            12,
            4
        );
    }
}

function drawCloud(x, y, scale) {

    ctx.save();

    ctx.translate(x, y);
    ctx.scale(scale, scale);

    ctx.fillStyle = "rgba(255,255,255,.75)";

    ctx.beginPath();
    ctx.arc(0, 10, 22, 0, Math.PI * 2);
    ctx.arc(25, 0, 28, 0, Math.PI * 2);
    ctx.arc(55, 12, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawPipes() {

    for (let pipe of pipes) {

        const bottomY = pipe.top + pipe.gap;

        // Top pipe
        drawPipe(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        // Bottom pipe
        drawPipe(
            pipe.x,
            bottomY,
            pipe.width,
            H - 55 - bottomY
        );
    }
}

function drawPipe(x, y, width, height) {

    // Main body
    ctx.fillStyle = "#39b94a";
    ctx.fillRect(x, y, width, height);

    // Highlight
    ctx.fillStyle = "#67d66e";
    ctx.fillRect(x + 8, y, 9, height);

    // Dark edge
    ctx.fillStyle = "#208d36";
    ctx.fillRect(x + width - 8, y, 8, height);

    // Cap
    ctx.fillStyle = "#42c853";

    const capHeight = 18;
    const capX = x - 5;
    const capWidth = width + 10;

    if (y === 0) {
        ctx.fillRect(
            capX,
            height - capHeight,
            capWidth,
            capHeight
        );
    } else {
        ctx.fillRect(
            capX,
            y,
            capWidth,
            capHeight
        );
    }

    // Cap highlight
    ctx.fillStyle = "#76df78";
    ctx.fillRect(
        capX + 5,
        y === 0
            ? height - capHeight + 3
            : y + 3,
        8,
        capHeight - 6
    );
}

function drawBird() {

    ctx.save();

    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Body
    ctx.fillStyle = "#ffd43b";

    ctx.beginPath();
    ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    ctx.fillStyle = "#f5b927";

    ctx.beginPath();
    ctx.ellipse(
        -7,
        5,
        11,
        7,
        -0.3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Eye
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(7, -7, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(9, -7, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ff8c32";

    ctx.beginPath();
    ctx.moveTo(13, -1);
    ctx.lineTo(27, 3);
    ctx.lineTo(13, 8);
    ctx.closePath();
    ctx.fill();

    // Tiny feather
    ctx.strokeStyle = "#d99c19";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(-11, -7);
    ctx.lineTo(-4, -12);
    ctx.stroke();

    ctx.restore();
}

function draw() {

    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawPipes();
    drawBird();
}

function loop() {

    if (!gameRunning) {
        draw();
        return;
    }

    update();
    draw();

    requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener("keydown", e => {

    if (e.code === "Space") {
        e.preventDefault();
        flap();
    }

    if (e.code === "Enter" && !gameRunning) {
        startGame();
    }
});

// Mouse
canvas.addEventListener("mousedown", flap);

// Touch
canvas.addEventListener(
    "touchstart",
    e => {
        e.preventDefault();
        flap();
    },
    { passive: false }
);

startBtn.addEventListener("click", startGame);

// Initial screen
resetGame();
draw();

</script>

</body>
</html>
